<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fyndaren admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--head:#1e293b;--green:#10b981;--gink:#059669;--line:#e2e8f0;--red:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162033;--ink:#e8eef7;--mute:#94a3b8;--head:#111a2e;--gink:#34d399;--line:#263349;--red:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin-inline:auto;padding:16px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.mark{width:42px;height:42px;border-radius:12px;background:#34d399;display:grid;place-items:center;font-size:22px}
h1{margin:0;font-size:20px}h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute)}
h2{font-size:17px;margin:22px 0 10px}
.sp{flex:1}
.panel{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
label{display:block;font-size:13px;color:var(--mute);margin-top:12px}
input,select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:16px;margin-top:4px}
input[type=color]{padding:4px;height:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:46px;border:0;border-radius:12px;background:var(--green);color:#fff;font-family:inherit;font-weight:700;font-size:16px;padding:0 18px;cursor:pointer;margin-top:16px;width:100%}
.btn.ghost{background:none;color:var(--gink);border:1px solid var(--line)}
.btn.sm{height:38px;font-size:14px;margin:0;width:auto;padding:0 14px}
.btn.red{background:none;color:var(--red);border:1px solid var(--red)}
.msg{min-height:20px;margin-top:10px;font-size:14px;color:var(--red)}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.dot{width:40px;height:40px;border-radius:12px;color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
.t{flex:1;min-width:0}.t b{display:block;font-size:15px;overflow-wrap:anywhere}.t span{font-size:13px;color:var(--mute)}
.acts{display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:14px;padding:11px 18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.toast.show{opacity:1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #34d399;outline-offset:2px}
.mark{width:46px;height:46px;border-radius:0;background:none;object-fit:contain;filter:drop-shadow(0 0 8px rgba(212,175,55,.45))}

.import-help{font-size:13px;color:var(--mute);line-height:1.5;margin:8px 0 12px}.import-row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.import-row input[type=checkbox]{width:20px;height:20px;flex:none;margin:2px 0}.import-row img{width:58px;height:58px;object-fit:contain;border-radius:9px;background:#fff;flex:none}.import-row .t{min-width:0}.import-row small{display:block;color:var(--mute);overflow-wrap:anywhere}.import-row .bad{color:var(--red)}.filepick{display:block;border:1px dashed var(--line);border-radius:14px;padding:14px;background:var(--bg)}.filepick input{height:auto;padding:8px 0;border:0;background:transparent}
</style>

<body>
<header><img class="mark" src="icon-192.png" alt="" width="46" height="46"><h1>Fyndaren admin<small id="who"></small></h1><div class="sp"></div><button class="btn ghost sm" id="out" hidden>Log out</button></header>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://ebmqzrejrpijitxeggsl.supabase.co';
const SUPABASE_KEY='sb_publishable_ep-vKQBf3tjvDC2h03BlYQ_hwUqrvY5';
let sb=null;try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
let user=null,isAdmin=false,DATA=[],CODES=[],view='deals',editId=null,filter='',IMPORT_ROWS=[];
const $=s=>document.querySelector(s);
const todayISO=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colr=c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:'#64748b';
const num=s=>{const n=parseFloat(String(s).replace(',','.'));return isNaN(n)?null:n};
const kr=n=>Number(n).toLocaleString('sv-SE',{maximumFractionDigits:2})+' kr';
const v=id=>$('#'+id).value;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
const setMsg=m=>{const e=$('#msg');if(e)e.textContent=m};

function loginView(note){
  $('#app').innerHTML=`<div class="panel"><b>Log in to manage deals</b><label for="em">Email</label><input id="em" type="email" autocomplete="email"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><div class="msg" id="msg" role="alert">${esc(note||'')}</div><button class="btn" data-login>Log in</button></div>`;
}
function denyView(){
  $('#app').innerHTML=`<div class="panel"><b>No access</b><p>You are logged in as ${esc(user.email)}, but this account is not an admin. Add it with the admin SQL, then reload this page.</p></div>`;
}
function formHTML(d){
  d=d||{};
  const cats=['Mat','Elektronik','Apotek','Kläder'].map(c=>`<option ${d.category===c?'selected':''}>${c}</option>`).join('');
  return `<div class="panel"><b id="ft">${editId?'Edit deal':'Add a deal'}</b>
  <div class="two"><div><label for="f_store">Store</label><input id="f_store" value="${esc(d.store)}" placeholder="ICA"></div><div><label for="f_cat">Category</label><select id="f_cat">${cats}</select></div></div>
  <label for="f_name">Product</label><input id="f_name" value="${esc(d.name)}" placeholder="Kycklingfilé 900 g">
  <div class="two"><div><label for="f_price">Deal price (kr)</label><input id="f_price" inputmode="decimal" value="${esc(d.price)}"></div><div><label for="f_old">Original price (kr)</label><input id="f_old" inputmode="decimal" value="${esc(d.old_price)}"></div></div>
  <div class="two"><div><label for="f_until">Valid until</label><input id="f_until" value="${esc(d.valid_until)}" placeholder="söndag eller 30/10"></div><div><label for="f_mem">Membership (optional)</label><input id="f_mem" value="${esc(d.membership)}" placeholder="ICA Stammis"></div></div>
  <div class="two"><div><label for="f_utext">Unit price text (optional)</label><input id="f_utext" value="${esc(d.unit_text)}" placeholder="87,78 kr/kg"></div><div><label for="f_uprice">Unit price number</label><input id="f_uprice" inputmode="decimal" value="${esc(d.unit_price)}" placeholder="87.78"></div></div>
  <label for="f_group">Compare group (optional, same name = compared together)</label><input id="f_group" value="${esc(d.compare_group)}" placeholder="Kyckling">
  <label for="f_aff">Shop link (optional, the affiliate link, must start with https://)</label><input id="f_aff" type="url" value="${esc(d.affiliate_url)}" placeholder="https://…">
  <label for="f_url">Store offer page (optional, a normal link, must start with https://)</label><input id="f_url" type="url" value="${esc(d.shop_url)}" placeholder="https://…">
  <div class="two"><div><label for="f_vt">Valid to (date; the deal hides itself after this day)</label><input id="f_vt" type="date" value="${esc(d.valid_to)}"></div><div><label for="f_chk">Last checked (date)</label><input id="f_chk" type="date" value="${esc(d.checked_on)}"></div></div>
  <button class="btn ghost sm" type="button" data-today style="margin-top:8px">Set last checked to today</button>
  <label for="f_cond">Conditions (optional, for example Buy 2 online)</label><input id="f_cond" value="${esc(d.conditions)}">
  <div class="two"><div><label for="f_logo">Logo letters (optional)</label><input id="f_logo" maxlength="4" value="${esc(d.logo)}"></div><div><label for="f_color">Logo colour</label><input id="f_color" type="color" value="${colr(d.color)==='#64748b'&&!d.color?'#10b981':colr(d.color)}"></div></div>
  <div class="msg" id="msg" role="alert"></div>
  <button class="btn" data-save>${editId?'Save changes':'Add deal'}</button>
  ${editId?'<button class="btn ghost" data-cancel>Cancel</button>':''}</div>`;
}
function adminView(){
  if(view==='codes'){codesView();return}if(view==='import'){importView();return}
  $('#app').innerHTML=tabsHTML()+formHTML(editId?DATA.find(x=>x.id===editId):null)+`<h2>All deals (<span id="count">0</span>)</h2><input id="flt" type="search" placeholder="Search deals…" aria-label="Search deals" value="${esc(filter)}"><div id="list" style="margin-top:10px"></div>`;
  renderList();
}
function renderList(){
  const t=filter.trim().toLowerCase();
  const items=DATA.filter(d=>!t||(d.store+' '+d.name+' '+d.category).toLowerCase().includes(t));
  $('#count').textContent=items.length;
  $('#list').innerHTML=items.length?items.map(d=>`<div class="item"><div class="dot" style="background:${colr(d.color)}">${esc(d.logo)}</div><div class="t"><b>${esc(d.store)}: ${esc(d.name)}</b><span>${kr(d.price)} (was ${kr(d.old_price)}) · until ${esc(d.valid_until)}${d.affiliate_url?' · has affiliate link':''}${d.shop_url?' · has page link':''}${d.valid_to&&d.valid_to<todayISO()?' · EXPIRED (hidden in the app)':''}</span></div><div class="acts"><button class="btn ghost sm" data-edit="${d.id}">Edit</button><button class="btn red sm" data-del="${d.id}">Delete</button></div></div>`).join(''):'<p>No deals found.</p>';
}
async function loadDeals(){
  const {data,error}=await sb.from('deals').select('*').order('id',{ascending:false});
  if(error){toast('Could not load deals');return}
  DATA=data;
  const cr=await sb.from('codes').select('*').order('id',{ascending:false});
  if(!cr.error)CODES=cr.data;
}
function tabsHTML(){
  return `<div class="two" style="margin-bottom:14px"><button class="btn ${view==='deals'?'':'ghost'} sm" style="width:100%" data-view="deals">Deals</button><button class="btn ${view==='codes'?'':'ghost'} sm" style="width:100%" data-view="codes">Discount codes</button><button class="btn ${view==='import'?'':'ghost'} sm" style="width:100%;grid-column:1/-1" data-view="import">Import products</button></div>`;
}
function codesView(){
  $('#app').innerHTML=tabsHTML()+`<div class="panel"><b>Add a discount code</b>
  <div class="two"><div><label for="c_store">Store</label><input id="c_store" placeholder="Zalando"></div><div><label for="c_code">Code</label><input id="c_code" placeholder="HOST15" autocapitalize="characters"></div></div>
  <label for="c_desc">What it gives</label><input id="c_desc" placeholder="15 % på höstnyheter">
  <div class="two"><div><label for="c_until">Valid until (optional)</label><input id="c_until" placeholder="31/10"></div><div><label for="c_color">Logo colour</label><input id="c_color" type="color" value="#10b981"></div></div>
  <label for="c_aff">Shop link (optional, must start with https://)</label><input id="c_aff" type="url" placeholder="https://…">
  <div class="msg" id="msg" role="alert"></div><button class="btn" data-csave>Add code</button></div>
  <h2>All codes (${CODES.length})</h2>`+(CODES.length?CODES.map(c=>`<div class="item"><div class="dot" style="background:${colr(c.color)}">${esc(c.logo||String(c.store).slice(0,2))}</div><div class="t"><b>${esc(c.store)}: ${esc(c.code)}</b><span>${esc(c.description)}${c.valid_until?' · until '+esc(c.valid_until):''}</span></div><div class="acts"><button class="btn red sm" data-cdel="${c.id}">Delete</button></div></div>`).join(''):'<p>No codes yet.</p>');
}
async function saveCode(){
  const store=v('c_store').trim(),code=v('c_code').trim().toUpperCase(),desc=v('c_desc').trim();
  if(!store||!code||!desc)return setMsg('Store, code and description are required.');
  const aff=v('c_aff').trim();
  if(aff&&!/^https:\/\/\S+$/i.test(aff))return setMsg('The shop link must start with https://');
  const w=store.split(/\s+/);
  const logo=w.length>1?w.map(x=>x[0]).join('').slice(0,3).toUpperCase():store.slice(0,3);
  setMsg('Saving…');
  const res=await sb.from('codes').insert({store,logo,color:v('c_color'),code,description:desc,valid_until:v('c_until').trim()||null,affiliate_url:aff||null}).select();
  if(res.error||!res.data||!res.data.length)return setMsg('Could not save. Did you run the codes SQL, and are you an admin?');
  toast('Code added');await loadDeals();codesView();
}
async function delCode(id){
  const c=CODES.find(x=>x.id===id);if(!c)return;
  if(!confirm('Delete the code '+c.code+' for '+c.store+'?'))return;
  const res=await sb.from('codes').delete().eq('id',id).select();
  if(res.error||!res.data||!res.data.length)return toast('Could not delete');
  toast('Code deleted');await loadDeals();codesView();
}
async function afterAuth(){
  $('#out').hidden=!user;$('#who').textContent=user?user.email:'';
  if(!user){isAdmin=false;loginView();return}
  const {data,error}=await sb.from('admins').select('user_id').eq('user_id',user.id);
  isAdmin=!error&&!!data&&data.length>0;
  if(!isAdmin){denyView();return}
  await loadDeals();adminView();
}
async function doLogin(){
  if(!sb)return setMsg('Could not start. Reload the page.');
  const email=v('em').trim(),pw=v('pw');
  if(!email||!pw)return setMsg('Enter your email and password.');
  setMsg('Please wait…');
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error)setMsg(error.message.includes('Invalid login')?'Wrong email or password.':error.message);
}
function collect(){
  const store=v('f_store').trim(),name=v('f_name').trim();
  let until=v('f_until').trim();const vt=v('f_vt');
  if(!until&&vt)until=(+vt.slice(8,10))+'/'+(+vt.slice(5,7));
  const price=num(v('f_price')),old=num(v('f_old'));
  if(!store||!name||!until)return {err:'Store, product and valid until are required.'};
  if(!price||price<=0||!old)return {err:'Enter a deal price and an original price.'};
  if(old<=price)return {err:'The original price must be higher than the deal price.'};
  const w=store.split(/\s+/);
  const logo=v('f_logo').trim()||(w.length>1?w.map(x=>x[0]).join('').slice(0,3).toUpperCase():store.slice(0,3));
  const aff=v('f_aff').trim();
  if(aff&&!/^https:\/\/\S+$/i.test(aff))return {err:'The shop link must start with https:// (use the link from your affiliate network).'};
  const url=v('f_url').trim();
  if(url&&!/^https:\/\/\S+$/i.test(url))return {err:'The offer page link must start with https://'};
  const cond=v('f_cond').trim(),chk=v('f_chk');
  return {p:{store,logo,color:v('f_color'),category:v('f_cat'),name,price,old_price:old,unit_text:v('f_utext').trim()||null,unit_price:num(v('f_uprice')),membership:v('f_mem').trim()||null,affiliate_url:aff||null,shop_url:url||null,valid_to:vt||null,checked_on:chk||null,conditions:cond||null,valid_until:until,compare_group:v('f_group').trim()||null}};
}
async function save(){
  const r=collect();if(r.err)return setMsg(r.err);
  setMsg('Saving…');
  let res;
  if(editId){res=await sb.from('deals').update(r.p).eq('id',editId).select()}
  else{const next=DATA.reduce((a,d)=>Math.max(a,d.id),0)+1;res=await sb.from('deals').insert({id:next,...r.p}).select()}
  if(res.error||!res.data||!res.data.length)return setMsg('Could not save. Are you logged in as an admin?');
  toast(editId?'Changes saved':'Deal added');
  editId=null;await loadDeals();adminView();scrollTo(0,0);
}
async function del(id){
  const d=DATA.find(x=>x.id===id);if(!d)return;
  if(!confirm('Delete "'+d.name+'" from '+d.store+'? This also removes it from users\' saved lists.'))return;
  const res=await sb.from('deals').delete().eq('id',id).select();
  if(res.error||!res.data||!res.data.length)return toast('Could not delete');
  toast('Deal deleted');await loadDeals();renderList();
}

function parseCSV(text){
 const first=(text.split(/\r?\n/,1)[0]||'');const delimiter=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
 const rows=[];let row=[],field='',quoted=false;
 for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'&&quoted&&text[i+1]==='"'){field+='"';i++}else if(ch==='"'){quoted=!quoted}else if(ch===delimiter&&!quoted){row.push(field);field=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=ch}
 row.push(field);if(row.some(x=>x.trim()))rows.push(row);
 if(rows.length<2)return [];
 const headers=rows.shift().map((h,i)=>h.trim()||('column_'+i));
 return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()])));
}
function parseXML(text){
 const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw new Error('The XML file could not be read.');
 let nodes=[...doc.querySelectorAll('item, product, entry, offer, article')];
 nodes=nodes.filter(n=>!nodes.some(p=>p!==n&&p.contains(n)));
 if(!nodes.length)nodes=[...doc.documentElement.children];
 return nodes.map(n=>{const o={};for(const a of [...n.attributes])o[a.name]=a.value;for(const x of [...n.children])o[x.localName]=x.textContent.trim();return o});
}
function fieldOf(o,aliases){
 const entries=Object.entries(o);for(const a of aliases){const found=entries.find(([k])=>k.toLowerCase().replace(/[^a-z0-9]/g,'')===a);if(found&&found[1])return String(found[1]).trim()}
 return '';
}
function normalizeImport(o,i){
 const store=fieldOf(o,['store','merchant','advertiser','brand','retailer'])||'Okänd butik';
 const name=fieldOf(o,['name','title','productname','producttitle','description','product']);
 const priceRaw=fieldOf(o,['price','saleprice','currentprice','finalprice','discountprice']);
 const oldRaw=fieldOf(o,['oldprice','originalprice','regularprice','rrp','listprice']);
 const image=fieldOf(o,['imageurl','image','imagelink','picture','pictureurl']);
 const tracking=fieldOf(o,['affiliateurl','trackingurl','deeplink','trackinglink']);
 const productUrl=fieldOf(o,['producturl','productlink','url','link']);
 const category=fieldOf(o,['category','productcategory','categoryname'])||'Övrigt';
 const price=parseFeedNumber(priceRaw),old=parseFeedNumber(oldRaw);
 const safeUrl=value=>{try{const u=new URL(value||'');return u.protocol==='http:'||u.protocol==='https:'?value:''}catch(e){return ''}};
 return {key:i,store,name,price,old_price:old,image_url:safeUrl(image),affiliate_url:safeUrl(tracking),shop_url:safeUrl(productUrl),category,duplicate:!!DATA.find(d=>String(d.store).toLowerCase()===store.toLowerCase()&&String(d.name).toLowerCase()===name.toLowerCase()),selected:false,raw:o};
}
function parseFeedNumber(s){if(!s)return null;let x=String(s).replace(/\s/g,'').replace(/[A-Za-z€$£]/g,'');if(x.includes(',')&&x.includes('.'))x=x.lastIndexOf(',')>x.lastIndexOf('.')?x.replace(/\./g,'').replace(',','.'):x.replace(/,/g,'');else x=x.replace(',','.');const n=Number(x);return Number.isFinite(n)&&n>0?n:null}
function importView(){
 $('#app').innerHTML=tabsHTML()+`<div class="panel"><b>Product feed preview</b><p class="import-help">Choose a CSV or XML product feed. The file is read locally. Nothing is saved until you select products and confirm.</p><label class="filepick">Choose feed file<input id="feedfile" type="file" accept=".csv,.xml,text/csv,application/xml,text/xml"></label><div class="msg" id="msg" role="alert"></div></div><div id="importpreview"></div>`;
}
function importIssue(r){
 if(!r.store||r.store==='Okänd butik')return 'Missing store';
 if(!r.name)return 'Missing product name';
 if(!r.price||!r.old_price||r.old_price<=r.price)return 'Invalid deal/original price';
 if(!r.affiliate_url&&!r.shop_url)return 'Missing product and affiliate links';
 if(r.duplicate)return 'Possible duplicate';
 return '';
}
function renderImport(){
 const box=$('#importpreview');if(!box)return;
 const eligible=IMPORT_ROWS.filter(r=>!importIssue(r)).length;
 const selected=IMPORT_ROWS.filter(r=>r.selected&&!importIssue(r)).length;
 box.innerHTML=IMPORT_ROWS.length?`<h2>Preview products (${IMPORT_ROWS.length})</h2><p class="import-help">${eligible} eligible. Products with missing details, invalid prices, missing links or possible duplicates are blocked.</p><div class="two" style="margin:12px 0"><button class="btn ghost sm" type="button" data-selectall>Select all eligible</button><button class="btn ghost sm" type="button" data-clearselect>Clear selection</button></div>`+IMPORT_ROWS.map(r=>{const issue=importIssue(r);return `<div class="import-row"><input type="checkbox" data-import-select="${r.key}" ${r.selected&&!issue?'checked':''} ${issue?'disabled':''} aria-label="Select product">${r.image_url?`<img src="${esc(r.image_url)}" alt="" onerror="this.style.display='none'">`:''}<div class="t"><b>${esc(r.name||'Unnamed product')}</b><small>${esc(r.store)} · ${r.price?kr(r.price):'No price'} ${r.old_price?'(was '+kr(r.old_price)+')':''}</small><small class="${issue?'bad':''}">${esc(issue||'Ready to add')}</small><small>${r.affiliate_url?'Affiliate link found':'No affiliate link'} · ${r.shop_url?'Product link found':'No product link'}</small></div></div>`}).join('')+`<div class="panel"><b>${selected} selected</b><button class="btn" type="button" data-publish-selected ${selected?'':'disabled'}>Add selected products</button><div class="msg" id="publishmsg" role="status"></div></div>`:`<p class="import-help">No products loaded yet.</p>`;
}
async function publishSelected(){
 const rows=IMPORT_ROWS.filter(r=>r.selected&&!importIssue(r));
 if(!rows.length)return toast('Select eligible products first');
 const keys=new Set();
 for(const r of rows){const k=(r.store+'|'+r.name).toLowerCase();if(keys.has(k)||DATA.some(d=>(String(d.store)+'|'+String(d.name)).toLowerCase()===k))return toast('Duplicate detected. Reload the feed.');keys.add(k)}
 const list=rows.map(r=>r.store+': '+r.name+' — '+kr(r.price)).join('\\n');
 if(!confirm('Publish '+rows.length+' selected product(s)?\\n\\n'+list+'\\n\\nThey will appear in active deals. Continue?'))return;
 const firstId=DATA.reduce((m,d)=>Math.max(m,Number(d.id)||0),0)+1;
 const payload=rows.map((r,i)=>{const parts=r.store.trim().split(/\\s+/);const logo=parts.length>1?parts.map(x=>x[0]).join('').slice(0,3).toUpperCase():r.store.slice(0,3).toUpperCase();return {id:firstId+i,store:r.store,logo,color:'#10b981',category:r.category||'Övrigt',name:r.name,price:r.price,old_price:r.old_price,image_url:r.image_url||null,affiliate_url:r.affiliate_url||null,shop_url:r.shop_url||null,valid_until:'Tills vidare',valid_to:null,checked_on:todayISO()};});
 const btn=$('[data-publish-selected]');if(btn){btn.disabled=true;btn.textContent='Saving…'}
 const result=await sb.from('deals').insert(payload).select();
 if(result.error||!result.data||result.data.length!==payload.length){const m=$('#publishmsg');if(m)m.textContent='Could not confirm the save. Check the deals list before retrying.';if(btn){btn.disabled=false;btn.textContent='Add selected products'}return}
 IMPORT_ROWS=IMPORT_ROWS.filter(r=>!r.selected);await loadDeals();renderImport();toast(rows.length+' product(s) published');
}
async function readFeed(file){
 if(!file)return;setMsg('Reading file…');
 try{const txt=await file.text();const objects=/\.xml$/i.test(file.name)||txt.trim().startsWith('<')?parseXML(txt):parseCSV(txt);IMPORT_ROWS=objects.map(normalizeImport);const seen=new Set();IMPORT_ROWS.forEach(r=>{const k=(r.store+'|'+r.name).toLowerCase();if(seen.has(k))r.duplicate=true;seen.add(k)});renderImport();setMsg(IMPORT_ROWS.length?'Feed loaded. Review and select products below.':'No product rows found.');}
 catch(e){IMPORT_ROWS=[];renderImport();setMsg(e.message||'Could not read this file.')}
}
// Feed import is intentionally preview-only. No database writes are performed here.

document.addEventListener('change',e=>{if(e.target.id==='feedfile')readFeed(e.target.files&&e.target.files[0]);if(e.target.matches('[data-import-select]')){const r=IMPORT_ROWS.find(x=>x.key===Number(e.target.dataset.importSelect));if(r){r.selected=e.target.checked;renderImport()}}});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.login!==undefined)doLogin();
  else if(d.save!==undefined)save();
  else if(d.cancel!==undefined){editId=null;adminView()}
  else if(d.edit){editId=+d.edit;adminView();scrollTo(0,0)}
  else if(d.del){del(+d.del)}
  else if(d.today!==undefined){$('#f_chk').value=todayISO()}
  else if(d.view){view=d.view;editId=null;adminView()}
  else if(d.csave!==undefined)saveCode()
  else if(d.cdel){delCode(+d.cdel)}
  else if(d.selectall!==undefined){IMPORT_ROWS.forEach(r=>r.selected=!importIssue(r));renderImport()}
  else if(d.clearselect!==undefined){IMPORT_ROWS.forEach(r=>r.selected=false);renderImport()}
  else if(d.publishSelected!==undefined){publishSelected()}
  else if(b.id==='out'){sb.auth.signOut()}
});
document.addEventListener('input',e=>{if(e.target.id==='flt'){filter=e.target.value;renderList()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='pw'||e.target.id==='em'))doLogin()});
(async()=>{
  if(!sb){loginView('Could not start. Reload the page.');return}
  const {data}=await sb.auth.getSession();
  user=data.session?data.session.user:null;
  await afterAuth();
  sb.auth.onAuthStateChange((ev,s)=>{const u=s?s.user:null;if((u&&u.id)!==(user&&user.id)){user=u;setTimeout(afterAuth,0)}});
})();
</script>
</body>
</html>
