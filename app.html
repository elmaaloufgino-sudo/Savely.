<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fyndaren – Smarta priser & dagens bästa kap</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fyndaren">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Cinzel:wght@600;700&display=swap">
<style>
:root{--bg:#0A0A0C;--card:#141416;--ink:#ffffff;--mute:#a1a1aa;--head:#0A0A0C;--green:#D4AF37;--gink:#E6CA65;--wbg:#2a2208;--wink:#E6CA65;--line:rgba(255,255,255,.1);--chip:#141416;--nav:#0A0A0C;--grad:linear-gradient(135deg,#D4AF37,#E6CA65);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:520px;margin-inline:auto;padding-bottom:84px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--head);padding:14px 16px 16px;border-radius:0 0 28px 28px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:14px;background:#34d399;display:grid;place-items:center;font-size:24px}
.brand h1{margin:0;font-size:24px;line-height:1.1;color:#fff;font-weight:800}
.brand p{margin:2px 0 0;font-size:13px;color:#34d399}
.sp{flex:1}
.hb{position:relative;width:46px;height:46px;border-radius:50%;border:0;background:#334155;color:#fff;display:grid;place-items:center;cursor:pointer}
.hb i{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#34d399;color:#0f172a;font-family:inherit;font-weight:700;font-size:11px;line-height:20px;font-style:normal;text-align:center}
.search{margin-top:14px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:none;height:46px;font:inherit;font-size:15px;color:#0f172a}
.search svg{color:#94a3b8;flex:none}
main{padding:16px}
h2{display:flex;align-items:center;gap:8px;font-size:18px;margin:18px 0 12px;font-weight:800}
h2 .n{margin-left:auto;font-size:13px;font-weight:400;color:var(--mute)}
.hero{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hero::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.hc{flex:0 0 78%;scroll-snap-align:start;border:0;text-align:left;color:#fff;border-radius:22px;padding:20px;font:inherit;cursor:pointer;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end}
.hc small{align-self:flex-start;background:rgba(255,255,255,.25);border-radius:12px;padding:3px 10px;font-size:11px;margin-bottom:auto}
.hc b{font-size:21px;line-height:1.2;margin-top:12px}
.hc span{font-size:14px;opacity:.9;margin-top:2px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:22px;padding:10px 18px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;background:var(--card);border-radius:20px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.08);display:flex;flex-direction:column}
.badge{position:absolute;top:12px;left:12px;background:var(--green);color:#fff;font-weight:700;font-size:13px;border-radius:12px;padding:3px 9px}
.fav{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);color:var(--mute);display:grid;place-items:center;cursor:pointer}
.fav.on{color:#f43f5e}.fav.on svg{fill:#f43f5e}
.logo{width:56px;height:56px;border-radius:16px;color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;margin:30px auto 10px}
.store{font-size:13px;color:var(--mute)}
.card h3{margin:2px 0 10px;font-size:16px;line-height:1.25;min-height:40px}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-size:21px;color:var(--gink)}
.price s{font-size:13px;color:var(--mute)}
.mute{font-size:13px;color:var(--mute);margin-top:2px}
.mem{align-self:flex-start;margin-top:8px;background:var(--wbg);color:var(--wink);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600}
.exp{margin-top:auto;padding-top:10px;font-size:12px;color:var(--mute)}
.sw{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:14px;color:var(--mute)}
.sw button{width:44px;height:26px;border-radius:13px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.sw button::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw button[aria-pressed="true"]{background:var(--green)}
.sw button[aria-pressed="true"]::after{transform:translateX(18px)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.row .logo{margin:0;width:46px;height:46px;font-size:12px;border-radius:14px;flex:none}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:15px;overflow-wrap:anywhere}.row .t span{font-size:13px;color:var(--mute)}
.best{border:2px solid var(--green)}
.tag{font-size:12px;font-weight:700;color:var(--gink)}
.code{border:2px dashed var(--green);background:none;color:var(--gink);font-family:inherit;font-weight:800;font-size:14px;border-radius:12px;padding:9px 12px;cursor:pointer;letter-spacing:.04em}
.sum{background:var(--head);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px}
.sum b{display:block;font-size:28px;color:#34d399}
.empty{text-align:center;color:var(--mute);padding:40px 20px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.empty .btn{margin-top:16px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--nav);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer;padding:6px 0}
nav button[aria-current="page"]{color:var(--gink)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:14px;padding:11px 18px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;align-items:end;justify-items:center;z-index:30}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4px}.sheet p{margin:0 0 6px;color:var(--mute);font-size:14px}
.sheet input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:0 14px;font:inherit;font-size:16px;margin-top:10px}
.btn{width:100%;height:48px;border:0;border-radius:14px;background:var(--green);color:#fff;font-family:inherit;font-weight:700;font-size:16px;margin-top:12px;cursor:pointer;padding:0 20px}
.btn.ghost{background:none;color:var(--gink);border:1px solid var(--line)}
.msg{min-height:20px;margin-top:10px;font-size:14px;color:var(--wink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #E6CA65;outline-offset:3px;border-radius:4px} button:focus:not(:focus-visible),input:focus:not(:focus-visible),a:focus:not(:focus-visible){outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

header{border-radius:0;border-bottom:1px solid var(--line);background:rgba(7,16,14,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.search{background:var(--chip);border:1px solid var(--line);border-radius:14px}
.search input{color:var(--ink)}
.search:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.chip[aria-pressed="true"]{color:#07100e}
.stats{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#0f1c18,#152722);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:6px}
.stats small{display:block;color:var(--mute);font-size:13px}.stats b{font-size:22px;color:var(--gink)}
.stats .si{width:46px;height:46px;border-radius:12px;background:rgba(16,185,129,.15);display:grid;place-items:center;font-size:20px}
.grid{display:flex;flex-direction:column;gap:12px}
.card{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);box-shadow:none}
.card:hover{background:#1b322b}
.card .logo{width:76px;height:76px;margin:0;position:relative;font-size:15px}
.card .badge{top:5px;left:5px;font-size:11px;padding:2px 6px;border-radius:6px;background:#ef4444}
.card .info{min-width:0}
.card .store{font-size:12px;color:var(--gink);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.card h3{margin:2px 0 6px;min-height:0;font-size:15px}
.card .exp{margin-top:0;padding-top:6px}
.card .fav{position:static;flex:none}
.demo{background:var(--wbg);color:var(--wink);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:10px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:8px 16px 24px}
footer a{color:var(--gink)}

/* ===== Lyxtema: onyx och guld ===== */
body{background:radial-gradient(120% 60% at 50% -10%,#1a1608,#0A0A0C 55%) fixed}
body::after{content:"";position:fixed;top:-160px;left:50%;width:560px;height:380px;max-width:140vw;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(212,175,55,.2),transparent);filter:blur(28px);animation:glow 8s ease-in-out infinite;pointer-events:none;z-index:0}
main,footer{position:relative;z-index:1}
header{background:rgba(10,10,12,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(212,175,55,.18)}
.brand h1,h2,.stats b,.sum b{font-family:Cinzel,Georgia,serif}
.brand h1{text-transform:uppercase;letter-spacing:.14em;font-size:22px}
.brand p{color:var(--gink)}
.mark{box-shadow:0 0 0 1px rgba(212,175,55,.55),0 6px 22px rgba(212,175,55,.25)}
.hb{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.hb i{background:var(--grad);color:#0A0A0C}
.search{background:rgba(255,255,255,.04);border:1px solid var(--line);transition:box-shadow .3s,border-color .3s}
.search:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(212,175,55,.22),0 0 44px rgba(212,175,55,.25)}
.hc{border:1px solid rgba(212,175,55,.3);transition:transform .35s,box-shadow .35s}
.hc:hover{transform:translateY(-4px);box-shadow:0 14px 40px rgba(212,175,55,.25)}
.chip{background:rgba(255,255,255,.04);transition:all .25s}.chip:hover{border-color:var(--green)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#0A0A0C;font-weight:700}
.stats{background:linear-gradient(135deg,rgba(212,175,55,.12),rgba(255,255,255,.03));border:1px solid rgba(212,175,55,.3);box-shadow:0 0 40px rgba(212,175,55,.08)}
.stats b{color:var(--gink)}.stats .si{background:rgba(212,175,55,.15)}
.card,.row{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .35s,box-shadow .35s,border-color .35s}
@media(hover:hover){.card:hover{transform:translateY(-5px);border-color:rgba(212,175,55,.55);box-shadow:0 16px 44px rgba(212,175,55,.22);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03))}.card:hover .logo{transform:scale(1.06)}}
.card .logo{transition:transform .5s ease;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.card .badge{background:var(--grad);color:#0A0A0C;font-weight:800}
.fav{background:rgba(255,255,255,.06);border:1px solid var(--line);transition:transform .2s,border-color .2s}
.fav:active{transform:scale(.9)}.fav.on{color:var(--gink);border-color:rgba(212,175,55,.6)}.fav.on svg{fill:var(--gink)}
.fav.pop svg{animation:pop .45s}
.best{border:1px solid var(--green);box-shadow:0 0 24px rgba(212,175,55,.2)}
.btn{background:var(--grad);color:#0A0A0C;transition:transform .25s,box-shadow .25s}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(212,175,55,.35)}
.btn.ghost{background:none;color:var(--gink);border:1px solid var(--line)}
.sum{background:linear-gradient(135deg,#1a1608,#0f0f12);border:1px solid rgba(212,175,55,.35)}.sum b{color:var(--gink)}
nav{background:rgba(10,10,12,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(212,175,55,.18)}
nav button{transition:color .25s,transform .25s}
nav button[aria-current="page"]{color:var(--gink);filter:drop-shadow(0 0 8px rgba(212,175,55,.45))}
nav button:active{transform:scale(.94)}
.toast{background:#1a1608;border:1px solid var(--green);color:var(--gink)}
.demo{border:1px solid rgba(212,175,55,.3)}
.enter{animation:fade .4s both}.enter .card,.enter .row{animation:up .55s both}
.skel{height:108px;border:0;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.11),rgba(255,255,255,.04));background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes glow{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes shim{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Keep mobile scrolling lighter: avoid per-card backdrop filtering on touch-sized screens. */
@media(max-width:767px){.card,.row{backdrop-filter:none;-webkit-backdrop-filter:none}}
/* Avoid a continuously animated blurred fixed layer on mobile GPUs. */
@media(max-width:767px){body::after{animation:none;filter:none;opacity:.7}}

/* ===== Förfining: bredare layout, sökruta, kategorier, meny ===== */
body{max-width:1100px;padding-bottom:104px}
main{padding:16px 24px}
header{padding-inline:24px}
.search{max-width:680px;margin-inline:auto;border-color:rgba(212,175,55,.35);box-shadow:0 0 28px rgba(212,175,55,.14)}
.chips{flex-wrap:wrap;justify-content:center;overflow:visible;margin:16px 0 0;padding:0}
.chip{padding:9px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
#main .row,#main .sum{max-width:720px;margin-inline:auto}
.card .cat{color:var(--mute);font-weight:500;text-transform:none;letter-spacing:0}
nav button{position:relative}
nav button svg{box-sizing:content-box;padding:7px;border-radius:50%;border:1px solid rgba(212,175,55,.35);background:rgba(212,175,55,.1);transition:background .25s,border-color .25s}
nav button[aria-current="page"] svg{background:rgba(212,175,55,.22);border-color:var(--green)}
.nb{position:absolute;top:0;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--grad);color:#0A0A0C;font-weight:800;font-size:11px;line-height:18px;font-style:normal;text-align:center;padding:0 5px}
.nb[hidden]{display:none}
.modal{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sheet{border:1px solid rgba(212,175,55,.35)}
.hc{flex-basis:min(78%,420px)}

/* ===== Kort två och två på mobil, rullande fyndlista ===== */
.ticker{overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,rgba(212,175,55,.16),rgba(212,175,55,.06),rgba(212,175,55,.16));border-bottom:1px solid rgba(212,175,55,.3);padding:7px 0;position:relative;z-index:1}
.ticker[hidden]{display:none}
.tk{display:inline-flex;animation:tick 34s linear infinite}
.ticker:hover .tk,.ticker:focus-within .tk{animation-play-state:paused}
.ti{display:inline-flex;align-items:center;gap:8px;margin-right:44px;font-size:13px;font-weight:700;color:#f3e5ab;background:none;border:0;cursor:pointer;font-family:inherit}
.tg{background:var(--grad);color:#0A0A0C;border-radius:6px;padding:1px 8px;font-size:10px;font-weight:800;letter-spacing:.06em}
@keyframes tick{to{transform:translateX(-50%)}}
.brand h1{background:linear-gradient(135deg,#fff 40%,#f3e5ab);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.grid{grid-template-columns:repeat(2,1fr);gap:12px}
.card{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden}
.tile{position:relative;height:112px;display:grid;place-items:center;overflow:hidden;background:var(--tc)}.product-shot{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12px 8px 20px;box-sizing:border-box;background:#fff}.logo-fallback{position:absolute;inset:0;align-items:center;justify-content:center}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.32));pointer-events:none}
.tl{position:relative;z-index:1;font-weight:800;font-size:26px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4);transition:transform .5s ease}.tl.brand-logo{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:28px 24px 12px;box-sizing:border-box;text-shadow:none}.tl.brand-logo img{display:block;max-width:100%;max-height:54px;object-fit:contain}.tl.brand-logo.apoteket{gap:7px;color:#fff;font-size:17px;font-weight:800;letter-spacing:-.6px}.tl.brand-logo.apoteket .apo-mark{width:30px;height:30px;flex:none;border-radius:8px;background:#fff;color:#16834a;display:grid;place-items:center;font-size:22px;font-weight:900}
.card:hover .tl{transform:scale(1.12)}
.tile .badge{z-index:2;top:8px;left:8px}
.tile .fav{position:absolute;z-index:2;top:6px;right:6px;width:34px;height:34px;background:rgba(10,10,12,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.fav:hover{transform:scale(1.12)}
.ptag{position:absolute;z-index:2;right:8px;bottom:8px;background:var(--grad);color:#0A0A0C;font-weight:800;font-size:13px;padding:4px 10px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.card .info{padding:12px}
.card h3{font-size:14px;line-height:1.25;min-height:0;margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .price{gap:8px;margin-top:0}
.card .price s{font-size:12px}
.sv{font-size:12px;color:var(--gink);font-weight:700}
.card.skel{height:210px}
@media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.tile{height:140px}.card h3{font-size:15px}}
@media(prefers-reduced-motion:reduce){.ticker{overflow-x:auto}}

/* ===== Extra glans (från ny designprompt) ===== */
body{background:radial-gradient(circle at 100% 60%,rgba(16,185,129,.06),transparent 40%) fixed,radial-gradient(120% 60% at 50% -10%,#1a1608,#0A0A0C 55%) fixed}
nav button:hover svg{transform:translateY(-2px);box-shadow:0 0 15px rgba(212,175,55,.3)}
.sheet{box-shadow:0 15px 40px rgba(0,0,0,.9),0 0 30px rgba(212,175,55,.25)}
.chip:hover{box-shadow:0 0 15px rgba(212,175,55,.25)}
.mark{width:52px;height:52px;border-radius:0;background:none;box-shadow:none;object-fit:contain;filter:drop-shadow(0 0 10px rgba(212,175,55,.5))}

/* ===== Butikslänk och annonsmärkning ===== */
.go{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.go a,.golink{display:inline-flex;align-items:center;min-height:36px;background:var(--grad);color:#0A0A0C;font-weight:700;font-size:12px;border-radius:8px;padding:6px 12px;text-decoration:none}
.golink{margin-top:6px}

async function doAuth(mode){

  if(!email||pw.length<6)return setMsg('Fyll i e-post och ett lösenord på minst 6 tecken.');

const favPending=new Set();
async function toggleFav(id){
  if(!user){openAuth('Logga in för att spara erbjudanden i din sparlista.');return}
  if(!sb||favPending.has(id))return;
  favPending.add(id);
  const had=favs.has(id);
  had?favs.delete(id):favs.add(id);popId=had?null:id;render();popId=null;
  try{
    const r=had?await sb.from('favorites').delete().eq('deal_id',id).eq('user_id',user.id):await sb.from('favorites').insert({deal_id:id,user_id:user.id});
    if(r.error)throw r.error;
    toast(had?'Borttagen från sparlistan':'Sparad i sparlistan');
  }catch(e){
    had?favs.add(id):favs.delete(id);
    toast('Det gick inte att uppdatera sparlistan. Försök igen.');
    render();
  }finally{
    favPending.delete(id);

  else if(d.logout!==undefined){sb.auth.signOut().then(()=>toast('Du är utloggad'))}
  else if(d.auth){doAuth(d.auth)}
  else if(d.copy){const c=d.copy;try{navigator.clipboard.writeText(c).then(()=>toast('Koden '+c+' är kopierad'),()=>toast('Din kod: '+c))}catch(x){toast('Din kod: '+c)}}
});
document.addEventListener('click',e=>{
  const cardEl=e.target.closest('.card[data-product]');
  if(!cardEl||e.target.closest('a,button,input,select,textarea,[data-fav]'))return;
  openProduct(Number(cardEl.dataset.product));
});
document.addEventListener('keydown',e=>{
  const cardEl=e.target.closest&&e.target.closest('.card[data-product]');
  if(cardEl&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openProduct(Number(cardEl.dataset.product));return}
  const dialog=$('#modal .sheet');
  if(!dialog)return;
  if(e.key==='Escape'){e.preventDefault();if($('#modal .product-sheet'))closeProduct();else closeAuth();return}
  if($('#modal .product-sheet')&&e.key==='ArrowLeft'){e.preventDefault();stepProduct(-1);return}
  if($('#modal .product-sheet')&&e.key==='ArrowRight'){e.preventDefault();stepProduct(1);return}
  if(e.key==='Tab'){
    const items=[...dialog.querySelectorAll('input:not([disabled]),button:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])')].filter(el=>el.getClientRects().length);
    if(!items.length){e.preventDefault();return}
    const first=items[0],last=items[items.length-1];
    if(e.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){e.preventDefault();first.focus()}
    return;
  }
  if(e.key==='Enter'&&e.target.matches('.sheet input')){
    e.preventDefault();
    doAuth('in');
  }
});
let searchTimer=null;
$('#q').addEventListener('input',e=>{
  q=e.target.value;
  if(tab!=='offers')tab='offers';
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{anim=false;render()},90);
});

if(sb){
  sb.auth.onAuthStateChange((ev,session)=>{
    user=session?session.user:null;
    setTimeout(loadFavs,0);
  });
}
loadDeals();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='offer-sort'){sortMode=e.target.value;render();}});
</script>
</body>
</html>
